<!-- Ленивая загрузка object 
<script src="./scripts/lazy-load.js" type="text/javascript" defer></script>
-->
<!-- Отложенная загрузка метрики и подсветки -->
<script>
  window.addEventListener('load', function () {
    const script = document.createElement('script');
    script.src = './scripts/deferred_scripts.js';
    document.body.appendChild(script);
  });
</script>
