<!-- Interviews -->
<section class="interviews section">
  <h3 class="section__header">{{ interviews["title"] }}</h3>
  <ul class="section__list">
    {% for interview in interviews["items"] %}
      <li class="section__item highlightable">
        <div class="section__item--left">
          <div class="video-container">
            <a
              class="video-preview"
              href="{{ interview.youtubeUrl }}"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Открыть видео на YouTube: {{ interview.title }}"
            >
              <img
                class="video-preview__image"
                src="{{ interview.thumbnail }}"
                alt="{{ interview.title }}"
                loading="lazy"
              />
              <span class="video-preview__play" aria-hidden="true"></span>
            </a>
          </div>
        </div>
        <div class="section__item--right">
          <p class="section__p section__p--smaller">
            <span>{{ interview.title }}</span>
          </p>
          <p class="section__p section__p--smaller">
            {{ interview.description }}
          </p>
        </div>
      </li>
    {% endfor %}
  </ul>
</section>
