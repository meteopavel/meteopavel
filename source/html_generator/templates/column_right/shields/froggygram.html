    "django_3.2.svg",
    "postgresql_13.10.svg",
    "drf_3.12.svg",
    "jwt.svg",
    "pytest.svg",
    "react_17.svg",
    "docker.svg",
    "nginx.svg",
  ] %}
  
  {% for shield in shields %}

      data="./images/shields/froggygram/{{ shield }}"
