<!-- Main Info -->
<section class="main-info section">
  <img
    src="{{ main_info.photo }}"
    alt="{{ main_info.alt }}"
    class="main-info__photo"
    width="300"
    height="300"
  />
  <h1>{{ main_info.name }}</h1>
  <h2>{{ main_info.position }}</h2>
  <p class="section__p">{{ main_info.description }}</p>
</section>
