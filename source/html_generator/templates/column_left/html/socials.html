<!-- Socials -->
<section class="social section">
  <ul class="socials__list">
    {% for social in socials %}
      <li class="socials__item">
        <a
          class="container__link"
          href="{{ social.href }}"
          target="_blank"
          aria-label="{{ social.ariaLabel }}"
          title="{{ social.title }}"
        >
          <svg class="contact-icon" viewBox="{{ social.viewBox }}">
            <use href="{{ social.icon }}" class="contact-icon" />
          </svg>
        </a>
      </li>
    {% endfor %}
  </ul>
</section>
