<svg xmlns="http://www.w3.org/2000/svg" width="$width" height="30" role="img" aria-label="$title">
  <title>$title</title>
  <a target="_blank" href="$docs_href">
    <linearGradient id="s" x2="0" y2="100%">
      <stop offset="0" stop-color="#bbb" stop-opacity=".1" />
      <stop offset="1" stop-opacity=".1" />
    </linearGradient>
    <clipPath id="r">
      <rect width="$width" height="30" rx="15" fill="#fff" />
    </clipPath>
    <g clip-path="url(#r)">
      <rect width="$width" height="30" fill="#16304d" />
      <rect width="$width" height="30" fill="url(#s)" />
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif"
      text-rendering="geometricPrecision" font-size="140">
      <image x="7" y="6" width="18" height="18"
        href="$svg_image_href" />
      <text aria-hidden="true" x="$x_offset" y="$y_offset" fill="#397474" fill-opacity=".5"
        transform="scale(.1)" textLength="$textLength">$title</text>
      <text x="$x" y="$y" transform="scale(.1)" fill="#21e7e7"
        textLength="$textLength">$title</text>
    </g>
  </a>
</svg>